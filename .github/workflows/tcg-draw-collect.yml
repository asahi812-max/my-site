name: Collect TCG lottery candidates

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect public RSS candidates
        run: python tcg-draw-automation/collect.py
      - name: Commit collected candidates
        run: |
          if git diff --quiet -- tcg-draw-automation/data/collected.json; then
            echo "No candidate changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tcg-draw-automation/data/collected.json
          git commit -m "Update TCG lottery candidates"
          git push
